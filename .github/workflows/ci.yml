name: CI Tests

on:
  push:
    branches: [staging, master]
  pull_request:
    branches: [staging]
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend Tests (Mocha)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: myjourney
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ptestpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: testpassword
      DB_NAME: myjourney
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'ci-placeholder' }}
      GEMINI_MODEL: gemini-pro

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        run: npm ci
        working-directory: api

      - name: Load schema and seed data into MySQL
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -ptestpassword myjourney < db/schema.sql
          mysql -h 127.0.0.1 -P 3306 -u root -ptestpassword myjourney < db/seed.sql

      - name: Run backend tests
        run: npm test
        working-directory: api

  frontend-tests:
    name: Frontend Tests (Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Run frontend tests
        run: npm test -- --watchAll=false
        working-directory: web
        env:
          CI: true
